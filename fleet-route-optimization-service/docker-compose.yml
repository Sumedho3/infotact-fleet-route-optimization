version: '3.8'

services:
  # ☕ Container 1: Your Spring Boot Java Microservice
  fleet-route-app:
    build: .
    container_name: fleet-optimization-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql-container-host
      - DB_PORT=3306
      - DB_NAME=fleet_db
      - DB_USERNAME=root       # Read securely from your host system
      - DB_PASSWORD=${SYSTEM_DB_ROOT_PASSWORD}   # Read securely from your host system
      - MAP_API_KEY=${SYSTEM_MAP_API_KEY}   # Read securely from your host system
    depends_on:
      mysql-container-host:
         condition: service_healthy
    networks:
      - fleet-network
    links:
      - mysql-container-host:mysql-container-host 
    
    # 🎯 ADDED: Resource allocation guardrails to prevent thread resource exhaustion
    deploy:
      resources:
        limits:
          cpus: '1.5'          # Maximum limit of 1.5 CPU cores
          memory: 1024M        # Maximum memory cap at 1GB RAM
        reservations:
          cpus: '0.5'          # Guaranteed baseline allocation of 0.5 CPU cores
          memory: 512M         # Guaranteed baseline allocation of 512MB RAM

  # 🗄️ Container 2: The MySQL Database Instance
  mysql-container-host:
    image: mysql:8.0
    container_name: mysql-database-server
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=fleet_db
      - MYSQL_PASSWORD=${SYSTEM_DB_PASSWORD} # Matches the Java app credentials securely
      - MYSQL_ROOT_PASSWORD=${SYSTEM_DB_ROOT_PASSWORD} # Secure root management password
    volumes:
      - mysql_fleet_data:/var/lib/mysql
    networks:
      - fleet-network
    healthcheck:                     # 👈 ADD THIS ENGINE BLOCK
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${SYSTEM_DB_ROOT_PASSWORD}"]
        timeout: 5s
        retries: 5
        start_period: 15s

# 💾 Persistent data storage configuration volumes
volumes:
  mysql_fleet_data:

# 🌐 Isolated virtual network bridge
networks:
  fleet-network:
    driver: bridge