spring:
  config:
    activate:
      on-profile: dev

  application:
    name: fleet-management-route-optimization

  datasource:
    # ⚙️ Hardcoded to your local Windows MySQL port (3306) and local database name
    url: jdbc:mysql://localhost:3306/infotact_fleet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root   # 👈 Change this to your real native Windows MySQL password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8081

app:
  external:
    map-service:
      base-url: "http://router.project-osrm.org"
      api-key: "${MAP_API_KEY:mock-local-developer-key}"       # 👈 Hardcoded value for local IDE testing
      timeout-ms: 5000